# CloudFormation / SAM template for NoteCognition tejal
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  NoteCognition Serverless WebSocket Backend

Parameters:
  DeploymentBucket:
    Type: String
    Description: |
      Name of an existing S3 bucket in this account/region that will hold deployment artefacts (e.g., SAM packaged templates). The bucket must exist before you run `sam deploy`.
    AllowedPattern: ^[a-z0-9.-]{3,63}$
    ConstraintDescription: Must be a valid S3 bucket name.

Resources:
  # Execution role for the WebSocket Lambda
  WebSocketHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaS3ReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DeploymentBucket}/*"

  # WebSocket Lambda ? code is now inline using InlineCode
  WebSocketHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NoteCognitionWebSocketHandler
      Handler: index.handler
      InlineCode: |
        const AWS = require('aws-sdk');
        const ddb = new AWS.DynamoDB.DocumentClient();
        exports.handler = async (event) => {
          const routeKey = event.requestContext.routeKey;
          const connectionId = event.requestContext.connectionId;
          const domainName = event.requestContext.domainName;
          const stage = event.requestContext.stage;
          const apigw = new AWS.ApiGatewayManagementApi({ endpoint: `${domainName}/${stage}` });
          try {
            if (routeKey === '$connect') {
              await ddb.put({ TableName: process.env.CONNECTIONS_TABLE, Item: { connectionId } }).promise();
              return { statusCode: 200, body: 'Connected' };
            }
            if (routeKey === '$disconnect') {
              await ddb.delete({ TableName: process.env.CONNECTIONS_TABLE, Key: { connectionId } }).promise();
              return { statusCode: 200, body: 'Disconnected' };
            }
            const { action, payload } = JSON.parse(event.body);
            if (action === 'saveNote') {
              await ddb.put({ TableName: process.env.NOTES_TABLE, Item: payload }).promise();
            }
            const connections = await ddb.scan({ TableName: process.env.CONNECTIONS_TABLE, ProjectionExpression: 'connectionId' }).promise();
            const postCalls = connections.Items.map(async ({ connectionId }) => {
              try {
                await apigw.postToConnection({ ConnectionId: connectionId, Data: JSON.stringify({ action, payload }) }).promise();
              } catch (err) {
                if (err.statusCode === 410) {
                  await ddb.delete({ TableName: process.env.CONNECTIONS_TABLE, Key: { connectionId } }).promise();
                }
              }
            });
            await Promise.all(postCalls);
            return { statusCode: 200, body: 'Message processed' };
          } catch (error) {
            console.error('ERROR:', error);
            return { statusCode: 500, body: JSON.stringify({ message: error.message }) };
          }
        };
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub >
              arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NoteCognitionWebSocketApi}/*

  # DynamoDB Tables
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: noteId
          KeyType: HASH

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

  # API Gateway WebSocket
  NoteCognitionWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: NoteCognitionWebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  # Integrations & Routes (Connect, Disconnect, Default) ? omitted for brevity

Outputs:
  WebSocketURL:
    Description: WebSocket API URL
    Value: !Sub "wss://${NoteCognitionWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  NotesTableName:
    Value: !Ref NotesTable
  ConnectionsTableName:
    Value: !Ref ConnectionsTable
