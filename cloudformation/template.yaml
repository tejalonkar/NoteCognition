AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  NoteCognition Serverless WebSocket Backend

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256

Resources:

  #########################################################
  # DynamoDB Tables
  #########################################################

  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: noteId
          KeyType: HASH

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

  #########################################################
  # WebSocket API
  #########################################################

  NoteCognitionWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
  # Execution role for the WebSocket Lambda
  WebSocketHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaS3ReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DeploymentBucket}/*"

  # WebSocket Lambda ? code is now inline using InlineCode
  WebSocketHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: NoteCognitionWebSocketHandler
      Handler: index.handler
      InlineCode: |
        const AWS = require('aws-sdk');
        const ddb = new AWS.DynamoDB.DocumentClient();
        exports.handler = async (event) => {
          const routeKey = event.requestContext.routeKey;
          const connectionId = event.requestContext.connectionId;
          const domainName = event.requestContext.domainName;
          const stage = event.requestContext.stage;
          const apigw = new AWS.ApiGatewayManagementApi({ endpoint: `${domainName}/${stage}` });
          try {
            if (routeKey === '$connect') {
              await ddb.put({ TableName: process.env.CONNECTIONS_TABLE, Item: { connectionId } }).promise();
              return { statusCode: 200, body: 'Connected' };
            }
            if (routeKey === '$disconnect') {
              await ddb.delete({ TableName: process.env.CONNECTIONS_TABLE, Key: { connectionId } }).promise();
              return { statusCode: 200, body: 'Disconnected' };
            }
            const { action, payload } = JSON.parse(event.body);
            if (action === 'saveNote') {
              await ddb.put({ TableName: process.env.NOTES_TABLE, Item: payload }).promise();
            }
            const connections = await ddb.scan({ TableName: process.env.CONNECTIONS_TABLE, ProjectionExpression: 'connectionId' }).promise();
            const postCalls = connections.Items.map(async ({ connectionId }) => {
              try {
                await apigw.postToConnection({ ConnectionId: connectionId, Data: JSON.stringify({ action, payload }) }).promise();
              } catch (err) {
                if (err.statusCode === 410) {
                  await ddb.delete({ TableName: process.env.CONNECTIONS_TABLE, Key: { connectionId } }).promise();
                }
              }
            });
            await Promise.all(postCalls);
            return { statusCode: 200, body: 'Message processed' };
          } catch (error) {
            console.error('ERROR:', error);
            return { statusCode: 500, body: JSON.stringify({ message: error.message }) };
          }
        };
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub >
              arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NoteCognitionWebSocketApi}/*

      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebSocketHandlerFunction.Arn

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebSocketHandlerFunction.Arn

  #########################################################
  # Routes
  #########################################################

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${ConnectIntegration}

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${DisconnectIntegration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${DefaultIntegration}

  #########################################################
  # Lambda Permissions
  #########################################################

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketHandlerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketHandlerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  DefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketHandlerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  #########################################################
  # Deployment + Stage
  #########################################################

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - DefaultRoute
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi

  ProductionStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: prod
      DeploymentId: !Ref WebSocketDeployment
      ApiId: !Ref NoteCognitionWebSocketApi
      AutoDeploy: true

Outputs:

  WebSocketURL:
    Description: WebSocket API URL
    Value: !Sub >
      wss://${NoteCognitionWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod

  NotesTableName:
    Description: Notes DynamoDB Table
    Value: !Ref NotesTable

  ConnectionsTableName:
    Description: Connections DynamoDB Table
    Value: !Ref ConnectionsTable