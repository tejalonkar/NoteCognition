# CloudFormation / SAM template for NoteCognition
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Serverless stack for NoteCognition application.

Parameters:
  DeploymentBucket:
    Type: String
    Description: |
      Name of an existing S3 bucket in this account/region that will hold deployment artefacts (e.g., SAM packaged templates). The bucket must exist before you run `sam deploy`.
    AllowedPattern: ^[a-z0-9.-]{3,63}$
    ConstraintDescription: Must be a valid S3 bucket name.

Resources:
  # Execution role for the WebSocket Lambda
  WebSocketHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaS3ReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DeploymentBucket}/*"

  # WebSocket Lambda – code is now inline using ZipFile
  WebSocketHandlerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: WebSocketHandler
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt WebSocketHandlerRole.Arn
      Code:
        ZipFile: |
          // Inline Lambda handler – copy the contents of backend/websocket/index.js here.
          const AWS = require('aws-sdk');
          const ddb = new AWS.DynamoDB.DocumentClient();
          const apigw = new AWS.ApiGatewayManagementApi({
            endpoint: process.env.WEBSOCKET_ENDPOINT
          });

          exports.handler = async (event) => {
            // Parse the incoming WebSocket message
            const records = event.Records || [];
            for (const record of records) {
              const body = JSON.parse(record.body);
              const { action, payload } = body;

              // Example: Persist a note to DynamoDB
              if (action === "saveNote") {
                await ddb.put({
                  TableName: process.env.NOTES_TABLE,
                  Item: payload
                }).promise();
              }

              // Broadcast the message to all connected clients
              const connections = await ddb.scan({
                TableName: process.env.CONNECTIONS_TABLE,
                ProjectionExpression: "connectionId"
              }).promise();

              const postCalls = connections.Items.map(item => {
                return apigw.postToConnection({
                  ConnectionId: item.connectionId,
                  Data: JSON.stringify({ action, payload })
                }).promise();
              });

              await Promise.all(postCalls);
            }
          };
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Ref WebSocketEndpoint
          NOTES_TABLE: !Ref NotesTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
      Timeout: 30
      MemorySize: 256

  # Example supporting resources (API GW, DynamoDB tables, etc.)
  WebSocketEndpoint:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: NoteCognitionWebSocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Notes
      AttributeDefinitions:
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: noteId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Connections
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

Outputs:
  WebSocketUrl:
    Description: URL for the WebSocket API
    Value: !Sub "wss://${WebSocketEndpoint.ApiId}.execute-api.${AWS::Region}.amazonaws.com/"
