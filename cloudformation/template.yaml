AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NoteCognition Cloud Backend Stack

Parameters:
  ProjectName:
    Type: String
    Default: notecognition
  Environment:
    Type: String
    Default: dev

Resources:
  NoteCognitionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-data-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  NoteCognitionAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-assets-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE]
            AllowedOrigins: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  NoteCognitionAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NoteCognitionAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadUploadedAssets
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "${NoteCognitionAssetsBucket.Arn}/uploads/*"

  BootstrapBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: notecognition-bootstrap-940920597951-ap-south-1
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBootstrapRead
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: arn:aws:s3:::notecognition-bootstrap-940920597951-ap-south-1/*

  NoteCognitionUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-user-pool-${Environment}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  NoteCognitionUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-client"
      UserPoolId: !Ref NoteCognitionUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  SyncServiceLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-sync-service-${Environment}"
      CodeUri: ../backend/sync/
      Handler: index.handler
      Runtime: nodejs20.x
      Environment:
        Variables:
          TABLE_NAME: !Ref NoteCognitionTable
          ASSET_BUCKET: !Ref NoteCognitionAssetsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NoteCognitionTable
        - S3WritePolicy:
            BucketName: !Ref NoteCognitionAssetsBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref NoteCognitionApi

  WebSocketHandlerLambda:
    Type: AWS::Serverless::Function
    Properties:
       Handler: index.handler
       Runtime: nodejs20.x
       InlineCode: |
         const AWS = require('aws-sdk');
         const dynamo = new AWS.DynamoDB.DocumentClient();

         exports.handler = async (event) => {
           console.log('WebSocket event:', JSON.stringify(event));
           // Example: echo back the received message
           const connectionId = event.requestContext.connectionId;
           const apiGateway = new AWS.ApiGatewayManagementApi({
             endpoint: `${event.requestContext.domainName}/${event.requestContext.stage}`
           });
           const payload = {
             action: 'echo',
             data: event.body
           };
           await apiGateway.postToConnection({
             ConnectionId: connectionId,
             Data: JSON.stringify(payload)
           }).promise();
           return { statusCode: 200, body: 'Message sent' };
         };

         // For $connect and $disconnect you could add extra logic here if needed
         // but SAM will still invoke this same handler for those routes.

         // Note: error handling omitted for brevity.
       Environment:
         Variables:
           TABLE_NAME: !Ref NoteCognitionTable
       Policies:
         - DynamoDBCrudPolicy:
             TableName: !Ref NoteCognitionTable
         - Statement:
             - Effect: Allow
               Action:
                 - s3:GetObject
                 - s3:GetObjectVersion
               Resource: arn:aws:s3:::notecognition-bootstrap-940920597951-ap-south-1/*

  StreamProcessorLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/stream-processor/
      Handler: index.handler
      Runtime: nodejs20.x
      Environment:
        Variables:
          TABLE_NAME: !Ref NoteCognitionTable
          WEBSOCKET_API_ENDPOINT: !Sub "https://${NoteCognitionWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NoteCognitionTable
        - Statement:
            - Effect: Allow
              Action:
                - 'execute-api:ManageConnections'
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NoteCognitionWebSocketApi}/${Environment}/*"
      Events:
        NoteStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt NoteCognitionTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 1

  NoteCognitionWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-websocket-${Environment}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      RouteKey: '$connect'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketConnectIntegration}'

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandlerLambda.Arn}/invocations'

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      RouteKey: '$disconnect'
      Target: !Sub 'integrations/${WebSocketDisconnectIntegration}'

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandlerLambda.Arn}/invocations'

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WebSocketConnectRoute
      - WebSocketDisconnectRoute
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref NoteCognitionWebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: !Ref Environment

  WebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketHandlerLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NoteCognitionWebSocketApi}/*'

  NoteCognitionApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: MyCognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          MyCognitoAuthorizer:
            UserPoolArn: !GetAtt NoteCognitionUserPool.Arn

Outputs:
  ApiUrl:
    Description: Base URL of the Sync API
    Value: !Sub "https://${NoteCognitionApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
  UserPoolId:
    Value: !Ref NoteCognitionUserPool
  UserPoolClientId:
    Value: !Ref NoteCognitionUserPoolClient
  S3BucketName:
    Value: !Ref NoteCognitionAssetsBucket
  WebSocketUrl:
    Description: WebSocket URL for real-time updates
    Value: !Sub "wss://${NoteCognitionWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
